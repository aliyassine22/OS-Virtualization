<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395"><rect width="1000" height="395" fill="#FFFFFF"/><text x="240" y="24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">Virtualizable ISA (Popek &amp; Goldberg, 1974)</text><circle cx="240" cy="200" r="150" fill="#0F7C80" fill-opacity="0.15" stroke="#0F7C80" stroke-width="2.5"/><text x="240" y="80" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#0F7C80" text-anchor="middle" dominant-baseline="central" font-weight="bold">Privileged instructions</text><text x="240" y="102" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#0F7C80" text-anchor="middle" dominant-baseline="central" font-weight="normal">(trap if executed outside ring 0)</text><circle cx="240" cy="230" r="85" fill="#3D4F8C" fill-opacity="0.22" stroke="#3D4F8C" stroke-width="2.5"/><text x="240" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#3D4F8C" text-anchor="middle" dominant-baseline="central" font-weight="bold">Sensitive</text><text x="240" y="244" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#3D4F8C" text-anchor="middle" dominant-baseline="central" font-weight="bold">instructions</text><text x="240" y="375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#2E8B57" text-anchor="middle" dominant-baseline="central" font-weight="bold">sensitive ⊆ privileged  ⇒  trap-and-emulate works</text><text x="735" y="24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">Classic x86 (before VT-x / AMD-V)</text><circle cx="660" cy="200" r="140" fill="#0F7C80" fill-opacity="0.15" stroke="#0F7C80" stroke-width="2.5"/><text x="610" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#0F7C80" text-anchor="middle" dominant-baseline="central" font-weight="bold">Privileged</text><text x="610" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#0F7C80" text-anchor="middle" dominant-baseline="central" font-weight="normal">CLI, STI, HLT, LGDT,</text><text x="610" y="156" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#0F7C80" text-anchor="middle" dominant-baseline="central" font-weight="normal">MOV CR3, IN/OUT ...</text><circle cx="820" cy="215" r="125" fill="#C8553D" fill-opacity="0.12" stroke="#C8553D" stroke-width="2.5"/><text x="735" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">sensitive</text><text x="735" y="215" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">and</text><text x="735" y="230" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">privileged</text><text x="850" y="120" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#C8553D" text-anchor="middle" dominant-baseline="central" font-weight="bold">Sensitive but</text><text x="850" y="138" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#C8553D" text-anchor="middle" dominant-baseline="central" font-weight="bold">NOT privileged</text><text x="872" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">POPF, PUSHF,</text><text x="872" y="206" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">SGDT, SIDT, SLDT,</text><text x="872" y="222" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">SMSW, STR, LAR, LSL,</text><text x="872" y="238" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">VERR, VERW, MOV/PUSH</text><text x="872" y="254" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="normal">seg, far CALL/JMP/RET</text><text x="735" y="375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#C8553D" text-anchor="middle" dominant-baseline="central" font-weight="bold">17 instructions never trap  ⇒  naive trap-and-emulate fails</text></svg>