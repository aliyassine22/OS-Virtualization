eration Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Physical hardware (CPU, RAM, NIC, disk)</text><text x="705" y="24" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">Type 2 - hosted hypervisor</text><text x="705" y="48" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#8A96A3" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="italic">VirtualBox, VMware Workstation, Parallels</text><rect x="510" y="75" width="125" height="50" rx="8" fill="#DDE6F0" stroke="none" stroke-width="1.5"/><text x="572.5" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">Apps</text><rect x="510" y="132" width="125" height="60" rx="8" fill="#3D4F8C" stroke="none" stroke-width="1.5"/><text x="572.5" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Guest OS</text><rect x="645" y="75" width="125" height="50" rx="8" fill="#DDE6F0" stroke="none" stroke-width="1.5"/><text x="707.5" y="100" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">Apps</text><rect x="645" y="132" width="125" height="60" rx="8" fill="#3D4F8C" stroke="none" stroke-width="1.5"/><text x="707.5" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Guest OS</text><rect x="510" y="198" width="260" height="40" rx="8" fill="#0F7C80" stroke="none" stroke-width="1.5"/><text x="640" y="218" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Hypervisor (user process)</text><rect x="780" y="132" width="125" height="106" rx="8" fill="#DDE6F0" stroke="none" stroke-width="1.5"/><text x="842.5" y="175.625" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">Host</text><text x="842.5" y="194.375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">apps</text><rect x="510" y="246" width="395" height="50" rx="8" fill="#1F2A44" stroke="none" stroke-width="1.5"/><text x="707.5" y="271" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Host operating system</text><rect x="510" y="304" width="395" height="52" rx="8" fill="#4A5560" stroke="none" stroke-width="1.5"/><text x="707.5" y="330" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Physical hardware</text><text x="500" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#8A96A3" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="italic">* KVM turns the Linux kernel itself into a Type 1 hypervisor; QEMU supplies device models in user space.</text></svg>