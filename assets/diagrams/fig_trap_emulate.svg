<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="205" viewBox="0 0 1000 205"><rect width="1000" height="205" fill="#FFFFFF"/><rect x="20" y="40" width="270" height="110" rx="8" fill="#3D4F8C" stroke="none" stroke-width="1.5"/><text x="155" y="85.625" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Guest kernel (ring 1)</text><text x="155" y="104.375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">... ADD  CLI  MOV ...</text><rect x="365" y="40" width="270" height="110" rx="8" fill="#0F7C80" stroke="none" stroke-width="1.5"/><text x="500" y="77.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">VMM (ring 0)</text><text x="500" y="95" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">decode + emulate CLI</text><text x="500" y="112.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">on the virtual CPU: vIF = 0</text><rect x="710" y="40" width="270" height="110" rx="8" fill="#3D4F8C" stroke="none" stroke-width="1.5"/><text x="845" y="76.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Guest resumes at</text><text x="845" y="95" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">next instruction</text><text x="845" y="113.75" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">(never noticed)</text><defs><marker id="ah4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E59A2B"/></marker></defs><line x1="292" y1="78" x2="362" y2="78" stroke="#E59A2B" stroke-width="2.2" marker-end="url(#ah4)"/><text x="327" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#E59A2B" text-anchor="middle" dominant-baseline="central" font-weight="bold">1. trap (#GP)</text><defs><marker id="ah5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F7C80"/></marker></defs><line x1="637" y1="78" x2="707" y2="78" stroke="#0F7C80" stroke-width="2.2" marker-end="url(#ah5)"/><text x="672" y="64" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#0F7C80" text-anchor="middle" dominant-baseline="central" font-weight="bold">2. return</text><text x="500" y="182" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#8A96A3" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="italic">Ordinary instructions (ADD, MOV, LOAD ...) execute directly on the CPU at full speed: the efficiency property.</text></svg>