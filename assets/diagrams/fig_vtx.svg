<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><rect width="1000" height="400" fill="#FFFFFF"/><rect x="20" y="20" width="600" height="135" rx="12" fill="#3D4F8C" fill-opacity="0.10" stroke="#3D4F8C" stroke-width="2"/><text x="36" y="40" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#3D4F8C" text-anchor="start" dominant-baseline="central" font-weight="bold">VMX non-root operation (guest)  - AMD: guest mode</text><rect x="40" y="58" width="270" height="80" rx="8" fill="#DDE6F0" stroke="none" stroke-width="1.5"/><text x="175" y="88.625" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">Guest apps</text><text x="175" y="107.375" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">(ring 3)</text><rect x="330" y="58" width="270" height="80" rx="8" fill="#3D4F8C" stroke="none" stroke-width="1.5"/><text x="465" y="81.75" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">Unmodified guest OS</text><text x="465" y="98" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">(ring 0 - full privilege</text><text x="465" y="114.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">over *virtual* state)</text><rect x="20" y="265" width="600" height="115" rx="12" fill="#0F7C80" fill-opacity="0.10" stroke="#0F7C80" stroke-width="2"/><text x="36" y="366" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#0F7C80" text-anchor="start" dominant-baseline="central" font-weight="bold">VMX root operation (hypervisor)  - AMD: host mode</text><rect x="40" y="280" width="560" height="64" rx="8" fill="#0F7C80" stroke="none" stroke-width="1.5"/><text x="320" y="303.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">VMM: handle exit reason, emulate device / update EPT,</text><text x="320" y="320.75" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" font-weight="bold">then VMRESUME</text><defs><marker id="ah6" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F7C80"/></marker></defs><line x1="170" y1="276" x2="170" y2="160" stroke="#0F7C80" stroke-width="2.2" marker-end="url(#ah6)"/><text x="182" y="185" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#0F7C80" text-anchor="start" dominant-baseline="central" font-weight="bold">VM entry</text><text x="182" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#0F7C80" text-anchor="start" dominant-baseline="central" font-weight="bold">VMLAUNCH / VMRESUME</text><text x="182" y="215" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#0F7C80" text-anchor="start" dominant-baseline="central" font-weight="bold">(AMD: VMRUN)</text><defs><marker id="ah7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E59A2B"/></marker></defs><line x1="430" y1="160" x2="430" y2="276" stroke="#E59A2B" stroke-width="2.2" marker-end="url(#ah7)"/><text x="442" y="185" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#E59A2B" text-anchor="start" dominant-baseline="central" font-weight="bold">VM exit (AMD: #VMEXIT)</text><text x="442" y="200" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#E59A2B" text-anchor="start" dominant-baseline="central" font-weight="bold">I/O, HLT, CPUID,</text><text x="442" y="215" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#E59A2B" text-anchor="start" dominant-baseline="central" font-weight="bold">EPT violation, interrupts</text><rect x="660" y="20" width="320" height="360" rx="8" fill="#F3F6F9" stroke="#1F2A44" stroke-width="1.5"/><text x="820" y="46" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1F2A44" text-anchor="middle" dominant-baseline="central" font-weight="bold">VMCS (Intel) / VMCB (AMD)</text><text x="820" y="66" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#8A96A3" text-anchor="middle" dominant-baseline="central" font-weight="normal" font-style="italic">one per vCPU, in memory</text><rect x="676" y="84" width="288" height="42" rx="6" fill="#FFFFFF" stroke="#3D4F8C" stroke-width="2"/><text x="690" y="98" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A44" text-anchor="start" dominant-baseline="central" font-weight="bold">Guest-state area</text><text x="690" y="114" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#8A96A3" text-anchor="start" dominant-baseline="central" font-weight="normal">saved / loaded on exit / entry</text><rect x="676" y="132" width="288" height="42" rx="6" fill="#FFFFFF" stroke="#0F7C80" stroke-width="2"/><text x="690" y="146" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A44" text-anchor="start" dominant-baseline="central" font-weight="bold">Host-state area</text><text x="690" y="162" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#8A96A3" text-anchor="start" dominant-baseline="central" font-weight="normal">loaded on every VM exit</text><rect x="676" y="180" width="288" height="42" rx="6" fill="#FFFFFF" stroke="#E59A2B" stroke-width="2"/><text x="690" y="194" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A44" text-anchor="start" dominant-baseline="central" font-weight="bold">VM-execution controls</text><text x="690" y="210" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#8A96A3" text-anchor="start" dominant-baseline="central" font-weight="normal">WHICH events cause exits</text><rect x="676" y="228" width="288" height="42" rx="6" fill="#FFFFFF" stroke="#8A96A3" stroke-width="2"/><text x="690" y="249" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A44" text-anchor="start" dominant-baseline="central" font-weight="bold">VM-exit controls</text><rect x="676" y="276" width="288" height="42" rx="6" fill="#FFFFFF" stroke="#8A96A3" stroke-width="2"/><text x="690" y="290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A44" text-anchor="start" dominant-baseline="central" font-weight="bold">VM-entry controls</text><text x="690" y="306" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#8A96A3" text-anchor="start" dominant-baseline="central" font-weight="normal">event injection</text><rect x="676" y="324" width="288" height="42" rx="6" fill="#FFFFFF" stroke="#C8553D" stroke-width="2"/><text x="690" y="338" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#1F2A44" text-anchor="start" dominant-baseline="central" font-weight="bold">VM-exit information</text><text x="690" y="354" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#8A96A3" text-anchor="start" dominant-baseline="central" font-weight="normal">exit reason + qualification</text></svg>